er-color .18s ease, transform .12s ease;\n  }\n  .ghost-btn:hover{ border-color: var(--amber-deep); transform: translateY(-1px); }\n\n  .actions-grid{ display:grid; grid-template-columns: minmax(0,1fr); gap: clamp(18px, 2.4vw, 28px); }\n  .action-group{ background: var(--cream-2); border: 1px solid var(--hairline); border-top: 3px solid var(--amber); padding: clamp(22px, 2.6vw, 32px); }\n  .action-group:nth-child(2){ border-top-color: var(--ink); }\n  .action-group h3{\n    display:flex; align-items: baseline; gap: 12px; margin: 0 0 18px;\n    font-size: var(--h3); font-weight: 800; letter-spacing: -0.02em;\n  }\n  .action-group h3 .gn{ font-family: var(--mono); font-size: 15px; color: var(--amber-deep); letter-spacing: 0; }\n  .checklist{ list-style:none; margin:0; padding:0; }\n  .checkline{\n    display:grid; grid-template-columns: 22px 1fr; gap: 13px; align-items: start;\n    padding-block: 13px; border-bottom: 1px solid var(--hairline);\n    color: var(--muted-2); line-height: 1.4; cursor: pointer;\n  }\n  .checkline:last-child{ border-bottom: 0; }\n  .checkline input{\n    appearance: none; -webkit-appearance: none;\n    width: 22px; height: 22px; margin: 0; margin-top: 1px;\n    border: 1px solid var(--hairline-strong); background: var(--cream);\n    display:grid; place-items:center; cursor: pointer;\n  }\n  .checkline input::after{ content: \"\"; width: 10px; height: 10px; background: var(--amber); transform: scale(0); transition: transform .12s ease; }\n  .checkline input:checked{ border-color: var(--amber-deep); }\n  .checkline input:checked::after{ transform: scale(1); }\n  .checkline input:checked + span{ color: var(--ink); }\n\n  /* === REVIEW === */\n  .review-grid{ display:grid; grid-template-columns: minmax(0,1fr); gap: clamp(18px, 2.4vw, 28px); }\n  .review-panel{ background: var(--cream-2); border: 1px solid var(--hairline); padding: clamp(22px, 2.6vw, 32px); }\n  .review-panel h3{ margin: 0 0 6px; font-size: var(--h3); font-weight: 800; letter-spacing: -0.02em; }\n  .review-panel > p{ margin: 0 0 18px; color: var(--muted-2); }\n  .score-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }\n  .score-btn{\n    min-height: 60px; background: var(--cream); border: 1px solid var(--hairline-strong);\n    font-size: 22px; font-weight: 800; color: var(--ink);\n    transition: border-color .15s ease, background .15s ease;\n  }\n  .score-btn:hover{ border-color: var(--amber-deep); }\n  .score-btn.active{ background: var(--amber); border-color: var(--amber); color: var(--ink); }\n  label.fieldlabel{\n    display:block; font-family: var(--mono); font-size: 12px; font-weight: 700;\n    letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 9px;\n  }\n  textarea{\n    width: 100%; border: 1px solid var(--hairline-strong); background: var(--cream);\n    color: var(--ink); padding: 13px 14px; line-height: 1.5; resize: vertical;\n  }\n  #dailyRep{ min-height: 96px; }\n  #afterAction{ min-height: 168px; }\n  .review-actions{ display:flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }\n  .primary-btn{\n    min-height: 44px; padding: 0 20px; background: var(--ink); border: 1px solid var(--ink); color: var(--cream);\n    font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;\n    transition: transform .12s ease, background .18s ease;\n  }\n  .primary-btn:hover{ transform: translateY(-1px); background: #221d12; }\n  .saved-note{ font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--amber-deep); min-height: 18px; }\n\n  /* === RULES (signal) === */\n  .command-card{ max-width: 880px; background: var(--ink); color: var(--cream); padding: clamp(22px, 3vw, 36px); }\n  .command-line{\n    display:flex; gap: 12px; align-items: baseline;\n    padding-bottom: 18px; margin-bottom: 8px; border-bottom: 1px solid rgba(246,242,233,0.18);\n    font-family: var(--mono); color: var(--cream-soft); overflow-wrap: anywhere;\n  }\n  .command-line .prompt{ color: var(--amber); font-weight: 700; }\n  .command-line code{ color: var(--cream); font-family: var(--mono); font-size: 16px; }\n  .rules{ list-style:none; margin:0; padding:0; counter-reset: rule; }\n  .rules li{\n    counter-increment: rule;\n    display:grid; grid-template-columns: auto 1fr; gap: 16px; align-items: baseline;\n    min-height: 56px; padding-block: 14px;\n    border-bottom: 1px solid rgba(246,242,233,0.14);\n    font-size: 17px; line-height: 1.4; color: var(--cream);\n  }\n  .rules li:last-child{ border-bottom: 0; }\n  .rules li::before{\n    content: counter(rule, decimal-leading-zero);\n    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--amber);\n    font-variant-numeric: tabular-nums;\n  }\n  .rules li em{ font-family: var(--serif); font-style: italic; color: var(--amber); font-weight: 500; }\n\n  @keyframes blink { 50% { opacity: 0; } }\n  .caret{ display:inline-block; width:1ch; color: var(--amber); animation: blink 1.05s steps(2) infinite; }\n\n  /* === FOOT === */\n  .foot{\n    padding-block: clamp(36px, 5vw, 56px);\n    font-family: var(--mono); font-size: 12px; font-weight: 700;\n    letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted);\n    line-height: 1.9;\n  }\n  .foot .lock{ color: var(--ink); }\n  .foot .lock em{ font-family: var(--serif); font-style: italic; color: var(--amber-deep); font-weight: 500; }\n  .foot p{ margin: 14px 0 0; max-width: 100ch; letter-spacing: 0.5px; text-transform: none; font-weight: 400; line-height: 1.7; color: var(--muted); }\n\n  /* === RESPONSIVE === */\n  @media (min-width: 56rem){\n    .navlink{ display:inline-block; }\n    .hero__grid{ grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.9fr); align-items: end; }\n    .pillar{ grid-template-columns: minmax(190px, 0.4fr) minmax(0,1fr); }\n    .method-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }\n    .method-card.feature{ grid-column: 1 / -1; }\n    .scanner-board{ grid-template-columns: repeat(4, minmax(0,1fr)); }\n    .actions-grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }\n    .review-grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    *, *::before, *::after{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }\n    .caret{ animation: none; opacity: 1; }\n  }\n\n  @media print{\n    @page{ margin: 14mm; }\n    html, body{ background: #fff; }\n    .topbar, .nav-actions{ display:none; }\n    .section, .hero{ border-color: var(--hairline-strong); break-inside: avoid; }\n    .pillar, .command-card, .scanner-tile, .action-group, .review-panel, .hero__panel{ break-inside: avoid; }\n    .section--ink, .hero__panel, .command-card{ background: #fff !important; color: var(--ink) !important; border: 1px solid var(--hairline-strong); }\n    .section--ink .section-head p, .session-row .label, .command-line, .rules li{ color: var(--ink) !important; }\n    .command-line .prompt, .rules li::before, .rules li em{ color: var(--amber-deep) !important; }\n  }\n<\/style>\n<\/head>\n<body>\n  \n\n  <header class=\"topbar\">\n    <div class=\"shell topbar__row\">\n      <div class=\"lockup\">\n        <div class=\"mark\">L<\/div>\n        <div class=\"wordmark\">LONGBOARD<em>AI<\/em><\/div>\n      <\/div>\n      <nav class=\"nav-actions\" aria-label=\"Page\">\n        <a class=\"navlink\" href=\"#pillars\">Pillars<\/a>\n        <a class=\"navlink\" href=\"#actions\">24 Actions<\/a>\n        <a class=\"navlink\" href=\"#review\">Review<\/a>\n        <button class=\"icon-btn\" type=\"button\" onclick=\"window.print()\" aria-label=\"Print the board\" title=\"Print\">\n          <svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9V3h12v6\"><\/path><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"><\/path><path d=\"M6 14h12v7H6z\"><\/path><\/svg>\n        <\/button>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <main>\n    <!-- HERO -->\n    <section class=\"shell hero\" id=\"top\">\n      <div class=\"hero__grid\">\n        <div>\n          <p class=\"eyebrow\"><span class=\"bullet\">●<\/span> Harada goal board · One dream, three pillars<\/p>\n          <h1>A <em>$10,000<\/em> winning buy trade.<\/h1>\n          <p class=\"hero__lede\">The edge is not more ideas. It is seeing enough names at once, recognizing the <em>missed monthly pivot<\/em> above, and being mentally ready to follow the signal when it appears.<\/p>\n        <\/div>\n        <aside class=\"hero__panel\" aria-label=\"Goal summary\">\n          <p class=\"panel-head\">Center goal<\/p>\n          <p class=\"panel-goal\"><em>$10,000<\/em><\/p>\n          <p class=\"panel-sub\">A buy-trade win earned from scanner discipline and pivot patience — an outcome, built on a process.<\/p>\n          <div class=\"session-row\"><span class=\"label\">Pillars<\/span><span class=\"value\">Three controllable<\/span><\/div>\n          <div class=\"session-row\"><span class=\"label\">Actions<\/span><span class=\"value\">24 daily reps<\/span><\/div>\n          <div class=\"session-row\"><span class=\"label\">North star<\/span><span class=\"value\"><em>Process<\/em>, not luck<\/span><\/div>\n        <\/aside>\n      <\/div>\n      <div class=\"windows\" aria-label=\"The three pillars at a glance\">\n        <div class=\"window\"><b>01<\/b><i>Scanner<\/i><span>Eight names in view before noise.<\/span><\/div>\n        <div class=\"window\"><b>02<\/b><i>Signal<\/i><span>Missed monthly pivot above.<\/span><\/div>\n        <div class=\"window\"><b>03<\/b><i>Mind<\/i><span>Calm enough to act on it.<\/span><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- PILLARS -->\n    <section class=\"shell section\" id=\"pillars\">\n      <div class=\"section-head\">\n        <p class=\"eyebrow\"><span class=\"bullet\">●<\/span> The compressed mandala<\/p>\n        <h2>Three <em>pillars,<\/em> more force.<\/h2>\n        <p>Classic Harada uses eight supporting areas. This version keeps the spirit but compresses the board into three high-leverage pillars — the environment, the signal discipline, and the mindset — with eight reps under each.<\/p>\n      <\/div>\n      <ol class=\"pillars\" id=\"pillars-list\"><\/ol>\n    <\/section>\n\n    <!-- 24 ACTIONS -->\n    <section class=\"shell section\" id=\"actions\">\n      <div class=\"section-head\">\n        <p class=\"eyebrow\"><span class=\"bullet\">●<\/span> The daily reps<\/p>\n        <h2>Twenty-four <em>actions.<\/em><\/h2>\n        <p>Each pillar gets eight concrete actions. Checking them stores progress in this browser, so the list becomes a daily practice surface.<\/p>\n      <\/div>\n      <div class=\"actions-bar\">\n        <div class=\"progress-wrap\">\n          <div class=\"progress-meta\"><span>Practice progress<\/span><strong id=\"progressText\">0 / 24<\/strong><\/div>\n          <div class=\"progress-track\" aria-hidden=\"true\"><div class=\"progress-fill\" id=\"progressFill\"><\/div><\/div>\n        <\/div>\n        <button class=\"ghost-btn\" id=\"clearChecks\" type=\"button\">Clear checks<\/button>\n      <\/div>\n      <div class=\"actions-grid\" id=\"actionsGrid\"><\/div>\n    <\/section>\n\n    <!-- REVIEW -->\n    <section class=\"shell section\" id=\"review\">\n      <div class=\"section-head\">\n        <p class=\"eyebrow\"><span class=\"bullet\">●<\/span> The mind<\/p>\n        <h2>The daily <em>review.<\/em><\/h2>\n        <p>A compact journal for the identity side of the board. Notes stay local in this browser and can be rewritten as the process gets sharper.<\/p>\n      <\/div>\n      <div class=\"review-grid\">\n        <article class=\"review-panel\">\n          <h3>Process score<\/h3>\n          <p>How well did the day match the trader this goal requires?<\/p>\n          <div class=\"score-grid\" id=\"scoreGrid\" aria-label=\"Daily process score\">\n            <button class=\"score-btn\" type=\"button\" data-score=\"1\">1<\/button>\n            <button class=\"score-btn\" type=\"button\" data-score=\"2\">2<\/button>\n            <button class=\"score-btn\" type=\"button\" data-score=\"3\">3<\/button>\n            <button class=\"score-btn\" type=\"button\" data-score=\"4\">4<\/button>\n          <\/div>\n          <label class=\"fieldlabel\" for=\"dailyRep\">Today's rep<\/label>\n          <textarea id=\"dailyRep\">I will only press when the long setup, risk, and hold plan agree.<\/textarea>\n        <\/article>\n        <article class=\"review-panel\">\n          <h3>After-action note<\/h3>\n          <p>What happened, what mattered, what changes.<\/p>\n          <label class=\"fieldlabel\" for=\"afterAction\">Trade log<\/label>\n          <textarea id=\"afterAction\">Setup:\nEntry:\nRisk:\nHold:\nExit:\nLesson:<\/textarea>\n          <div class=\"review-actions\">\n            <button class=\"primary-btn\" id=\"saveJournal\" type=\"button\">Save review<\/button>\n            <button class=\"ghost-btn\" id=\"clearJournal\" type=\"button\">Clear<\/button>\n            <span class=\"saved-note\" id=\"savedNote\" role=\"status\"><\/span>\n          <\/div>\n        <\/article>\n      <\/div>\n    <\/section>\n\n    <!-- METHOD -->\n    <section class=\"shell section\" id=\"method\">\n      <div class=\"section-head\">\n        <p class=\"eyebrow\"><span class=\"bullet\">●<\/span> Why this works<\/p>\n        <h2>The Harada <em>method.<\/em><\/h2>\n        <p>The method converts a large ambition into a system of supporting capabilities and daily actions. It works because the next behavior becomes obvious.<\/p>\n      <\/div>\n      <div class=\"method-grid\">\n        <article class=\"method-card feature\">\n          <h3>The basic <em>structure.<\/em><\/h3>\n          <p>Classic Harada uses one center goal, eight supporting areas, and eight actions under each area. This version keeps the spirit but compresses the map into three high-leverage pillars with eight actions under each.<\/p>\n          <div class=\"diagram\" aria-label=\"Harada structure\">\n            <div>Scanner<\/div><div>Signal<\/div><div>Mindset<\/div>\n            <div>Prepare<\/div><div class=\"core\">Goal<\/div><div>Act<\/div>\n            <div>Review<\/div><div>Repeat<\/div><div>Trust<\/div>\n          <\/div>\n        <\/article>\n        <article class=\"method-card\">\n          <h3>Why it fits <em>trading.<\/em><\/h3>\n          <p>The $10,000 win comes from a repeatable operating environment: enough stocks in view, a real signal worth acting on, and a mind that does not flinch at the moment of decision.<\/p>\n        <\/article>\n        <article class=\"method-card\">\n          <h3>The Ohtani <em>lesson.<\/em><\/h3>\n          <p>Ohtani mixed performance skills with character habits. The trading version does the same: chart work matters, and so do patience, restraint, and review.<\/p>\n        <\/article>\n        <article class=\"method-card\">\n          <h3>How to <em>use it.<\/em><\/h3>\n          <ul>\n            <li>Open the eight-stock scanner first — not as a backup after boredom.<\/li>\n            <li>Look for a <b>missed monthly pivot above<\/b> plus a live signal.<\/li>\n            <li>Rehearse the behavior with the checklist before the trade arrives.<\/li>\n            <li>Review whether you <b>followed the signal<\/b>, not whether the day felt dramatic.<\/li>\n          <\/ul>\n        <\/article>\n      <\/div>\n    <\/section>\n\n\n  <\/main>\n\n  <footer class=\"shell foot\">\n    <div class=\"lock\"><span style=\"color:var(--amber-deep)\">●<\/span> LONGBOARD<em> AI<\/em> &nbsp;·&nbsp; HARADA GOAL BOARD &nbsp;·&nbsp; THE $10,000 BUY TRADE<\/div>\n    <p>This is a process design tool, not financial advice or a forecast. The $10,000 winning trade is an outcome target; the board is built around controllable preparation, signal discipline, execution, and review.<\/p>\n  <\/footer>\n\n<script>\n  const areas = [\n    {\n      title: \"The eight-stock scanner\",\n      summary: \"Create the visual environment where the right buy setup can reveal itself across multiple names at once.\",\n      actions: [\n        \"Open the scanner before the session and keep eight stocks visible at once.\",\n        \"Use the scanner as the first screen, not a backup after boredom starts.\",\n        \"Prefer names with clean structure, relative volume, and room toward the pivot.\",\n        \"Avoid tunnel vision on one ticker while better signals form elsewhere.\",\n        \"Refresh the board intentionally instead of constantly reshuffling it.\",\n        \"Keep each tile readable: ticker, signal, pivot distance, trend state.\",\n        \"Promote only the best signal into deeper chart focus.\",\n        \"End the session by saving the eight-name board that mattered.\"\n      ]\n    },\n    {\n      title: \"The missed monthly pivot\",\n      summary: \"Boldly follow valid long signals when there is a missed monthly pivot above acting as the magnet.\",\n      actions: [\n        \"Check for a missed monthly pivot above before imagining the $10k move.\",\n        \"Treat the pivot as the destination, not decoration on the chart.\",\n        \"Wait for the live buy signal instead of anticipating it too early.\",\n        \"Act when scanner signal, chart structure, and pivot location agree.\",\n        \"Do not downgrade a valid signal because it feels emotionally large.\",\n        \"Define the invalidation level before entering.\",\n        \"Hold while the signal is valid and the pivot remains unfinished.\",\n        \"Exit or reduce when the signal fails, not when fear gets loud.\"\n      ]\n    },\n    {\n      title: \"The daily frame of mind\",\n      summary: \"Be calm, prepared, and willing to act when the scanner shows the trade you said you wanted.\",\n      actions: [\n        \"Begin with one sentence: I follow clean signals with calm size.\",\n        \"Review yesterday's hesitation without attacking yourself.\",\n        \"Name the emotion most likely to interfere today.\",\n        \"Decide before the open what bold but controlled action looks like.\",\n        \"Use a breath or reset before taking the signal.\",\n        \"Do not negotiate with a valid setup after the plan is clear.\",\n        \"Let one good signal be enough; do not demand constant action.\",\n        \"Score the day on seeing, trusting, and following the process.\"\n      ]\n    }\n  ];\n\n  const scannerStocks = [\n    { symbol: \"ATPC\", signal: \"Buy\",   pivot: \"+18.4%\", rvol: \"7.2x\", trend: \"Stacked\",       bars: [28, 34, 42, 54, 70, 86] },\n    { symbol: \"NIVF\", signal: \"Buy\",   pivot: \"+22.1%\", rvol: \"8.6x\", trend: \"Breakout\",      bars: [30, 46, 52, 64, 78, 94] },\n    { symbol: \"PEGY\", signal: \"Buy\",   pivot: \"+15.6%\", rvol: \"6.4x\", trend: \"Reclaim\",       bars: [26, 30, 44, 56, 62, 80] },\n    { symbol: \"LIDR\", signal: \"Buy\",   pivot: \"+19.9%\", rvol: \"9.3x\", trend: \"Opening drive\", bars: [24, 36, 50, 64, 80, 96] },\n    { symbol: \"SUGP\", signal: \"Watch\", pivot: \"+11.8%\", rvol: \"5.9x\", trend: \"Curling\",       bars: [22, 38, 31, 47, 44, 56] },\n    { symbol: \"CYN\",  signal: \"Watch\", pivot: \"+13.3%\", rvol: \"5.1x\", trend: \"Higher low\",    bars: [18, 28, 24, 38, 42, 52] },\n    { symbol: \"KAVL\", signal: \"Wait\",  pivot: \"+9.5%\",  rvol: \"3.1x\", trend: \"Base\",          bars: [34, 28, 36, 32, 38, 40] },\n    { symbol: \"SOPA\", signal: \"Risk\",  pivot: \"+7.2%\",  rvol: \"4.7x\", trend: \"Extended\",      bars: [46, 64, 78, 70, 58, 50] }\n  ];\n\n  const storageKey = \"longboard-harada-10000-buy-trade\";\n\n  function loadState(){\n    try{ return JSON.parse(localStorage.getItem(storageKey)) || {}; }\n    catch{ return {}; }\n  }\n  function saveState(next){ localStorage.setItem(storageKey, JSON.stringify(next)); }\n\n  const state = { checks:{}, score:\"\", dailyRep:\"\", afterAction:\"\", ...loadState() };\n\n  function renderPillars(){\n    document.getElementById(\"pillars-list\").innerHTML = areas.map((area, i) => `\n      <li class=\"pillar\">\n        <div class=\"pillar__meta\">\n          <div class=\"pillar__num\"><span class=\"n\">${String(i+1).padStart(2,\"0\")}<\/span>Pillar<\/div>\n          <span class=\"pillar-chip\">8 reps<\/span>\n        <\/div>\n        <div class=\"pillar__body\">\n          <h3>${area.title}<\/h3>\n          <p>${area.summary}<\/p>\n        <\/div>\n      <\/li>`).join(\"\");\n  }\n\n  function renderScanner(){\n    document.getElementById(\"scannerBoard\").innerHTML = scannerStocks.map(stock => {\n      const isBuy = stock.signal === \"Buy\";\n      return `\n      <article class=\"scanner-tile\">\n        <header>\n          <h3>${stock.symbol}<\/h3>\n          <span class=\"signal-pill\" data-buy=\"${isBuy}\">${stock.signal}<\/span>\n        <\/header>\n        <div class=\"mini-chart\" aria-label=\"${stock.symbol} mini chart\">\n          ${stock.bars.map((bar, idx) => `<span style=\"--bar:${bar}%; --bar-color:${idx === stock.bars.length-1 && isBuy ? \"var(--amber)\" : \"var(--hairline-strong)\"}\"><\/span>`).join(\"\")}\n        <\/div>\n        <div class=\"scanner-facts\">\n          <div><span>Pivot above<\/span><strong>${stock.pivot}<\/strong><\/div>\n          <div><span>RVOL<\/span><strong>${stock.rvol}<\/strong><\/div>\n          <div><span>Trend<\/span><strong>${stock.trend}<\/strong><\/div>\n          <div><span>Job<\/span><strong>${isBuy ? \"Follow\" : \"Track\"}<\/strong><\/div>\n        <\/div>\n      <\/article>`;\n    }).join(\"\");\n  }\n\n  function renderActions(){\n    document.getElementById(\"actionsGrid\").innerHTML = areas.map((area, ai) => `\n      <article class=\"action-group\">\n        <h3><span class=\"gn\">${String(ai+1).padStart(2,\"0\")}<\/span>${area.title}<\/h3>\n        <ul class=\"checklist\">\n          ${area.actions.map((action, xi) => {\n            const id = `${ai}-${xi}`;\n            return `<li><label class=\"checkline\">\n              <input type=\"checkbox\" data-check=\"${id}\" ${state.checks[id] ? \"checked\" : \"\"} />\n              <span>${action}<\/span>\n            <\/label><\/li>`;\n          }).join(\"\")}\n        <\/ul>\n      <\/article>`).join(\"\");\n\n    document.querySelectorAll(\"[data-check]\").forEach(box => {\n      box.addEventListener(\"change\", () => {\n        state.checks[box.dataset.check] = box.checked;\n        saveState(state);\n        updateProgress();\n      });\n    });\n    updateProgress();\n  }\n\n  function updateProgress(){\n    const total = areas.reduce((s,a) => s + a.actions.length, 0);\n    const valid = new Set(areas.flatMap((a,ai) => a.actions.map((_,xi) => `${ai}-${xi}`)));\n    const checked = Object.entries(state.checks).filter(([id,v]) => valid.has(id) && v).length;\n    document.getElementById(\"progressText\").textContent = `${checked} / ${total}`;\n    document.getElementById(\"progressFill\").style.width = `${total ? (checked/total)*100 : 0}%`;\n  }\n\n  function setupReview(){\n    const dailyRep = document.getElementById(\"dailyRep\");\n    const afterAction = document.getElementById(\"afterAction\");\n    const savedNote = document.getElementById(\"savedNote\");\n\n    if (state.dailyRep) dailyRep.value = state.dailyRep;\n    if (state.afterAction) afterAction.value = state.afterAction;\n\n    document.querySelectorAll(\"[data-score]\").forEach(btn => {\n      btn.classList.toggle(\"active\", btn.dataset.score === String(state.score));\n      btn.addEventListener(\"click\", () => {\n        state.score = btn.dataset.score;\n        document.querySelectorAll(\"[data-score]\").forEach(b => b.classList.toggle(\"active\", b === btn));\n        saveState(state);\n      });\n    });\n\n    document.getElementById(\"saveJournal\").addEventListener(\"click\", () => {\n      state.dailyRep = dailyRep.value;\n      state.afterAction = afterAction.value;\n      saveState(state);\n      savedNote.textContent = \"Saved locally\";\n      window.setTimeout(() => { savedNote.textContent = \"\"; }, 2200);\n    });\n\n    document.getElementById(\"clearJournal\").addEventListener(\"click\", () => {\n      dailyRep.value = \"\";\n      afterAction.value = \"\";\n      state.dailyRep = \"\";\n      state.afterAction = \"\";\n      saveState(state);\n      savedNote.textContent = \"Cleared\";\n      window.setTimeout(() => { savedNote.textContent = \"\"; }, 2200);\n    });\n  }\n\n  document.getElementById(\"clearChecks\").addEventListener(\"click\", () => {\n    state.checks = {};\n    saveState(state);\n    document.querySelectorAll(\"[data-check]\").forEach(box => { box.checked = false; });\n    updateProgress();\n  });\n\n  // Copy signal rules\n  (function(){\n    const btn = document.getElementById(\"copy-rules\");\n    const list = document.getElementById(\"rules-list\");\n    if (!btn || !list) return;\n    function collect(){\n      return Array.from(list.querySelectorAll(\"li\"))\n        .map((li, i) => String(i+1).padStart(2,\"0\") + \". \" + li.textContent.trim())\n        .join(\"\\n\");\n    }\n    function copied(){\n      btn.dataset.state = \"copied\";\n      btn.setAttribute(\"title\",\"Copied\");\n      window.setTimeout(() => { delete btn.dataset.state; btn.setAttribute(\"title\",\"Copy rules\"); }, 2500);\n    }\n    btn.addEventListener(\"click\", () => {\n      const text = collect();\n      if (navigator.clipboard && navigator.clipboard.writeText){\n        navigator.clipboard.writeText(text).then(copied).catch(fallback);\n      } else { fallback(); }\n      function fallback(){\n        const area = document.createElement(\"textarea\");\n        area.value = text; area.setAttribute(\"readonly\",\"\"); area.style.position=\"fixed\"; area.style.opacity=\"0\";\n        document.body.appendChild(area); area.select();\n        try{ document.execCommand(\"copy\"); copied(); }catch(e){}\n        document.body.removeChild(area);\n      }\n    });\n  })();\n\n  renderPillars();\n  renderActions();\n  setupReview();\n<\/script>\n\n\n<\/body><\/html>"
  </script>
