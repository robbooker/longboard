<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Longboard Share Card</title>
<!--
  Card template for scripts/generate-cards.mjs. Puppeteer opens this
  file with query params and screenshots the .card element at the
  exact pixel dimensions specified by the size param.

  Params (set via URL search string or injected by the generator):
    treatment  "a" | "b"
    w          width in px (1200 | 1080)
    h          height in px (630 | 1080 | 1920)
    kicker     short topic tag, e.g. "On automation"
    quote      the pull-quote text (HTML, may contain <em>)
    issue      zero-padded issue number, e.g. "008"
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4efe6;
    --ink: #14110d;
    --ink-2: #3a342a;
    --ink-3: #6a6357;
    --rule-soft: #c7bfae;
    --moss: #3d5b4a;
    --moss-2: #6fae8a;
    --display: "Fraunces", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; background: transparent; }

  .card {
    position: relative;
    overflow: hidden;
    font-family: var(--display);
  }

  /* Paper grain — shared by both treatments (different colors) */
  .grain-light {
    background-color: var(--paper);
    background-image:
      radial-gradient(rgba(60,40,20,.035) 1px, transparent 1px),
      radial-gradient(rgba(60,40,20,.025) 1px, transparent 1px);
    background-size: 6px 6px, 14px 14px;
    background-position: 0 0, 3px 3px;
  }
  .grain-dark {
    background-color: var(--ink);
    background-image:
      radial-gradient(rgba(244,239,230,.02) 1px, transparent 1px),
      radial-gradient(rgba(244,239,230,.015) 1px, transparent 1px);
    background-size: 6px 6px, 14px 14px;
  }

  /* ── Wordmark ── */
  .wordmark {
    font-family: var(--display); font-weight: 700;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    letter-spacing: -0.025em; line-height: 1;
  }
  .wordmark em { font-style: italic; font-weight: 500; color: var(--moss); }

  /* ── Kicker line ── */
  .kicker-line {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: .22em;
    color: var(--moss);
  }
  .kicker-line::before {
    content: "§"; font-family: var(--display); font-style: italic;
    letter-spacing: 0; color: var(--moss);
  }

  /* ── Attr line ── */
  .attr-line {
    font-family: var(--mono); text-transform: uppercase; letter-spacing: .16em;
    color: var(--ink-3);
  }
  .attr-line em {
    font-family: var(--display); font-style: italic;
    text-transform: none; letter-spacing: 0; color: var(--moss);
  }

  /* ════════════════════════════════════════════
     TREATMENT A — cream paper, regular weight
     ════════════════════════════════════════════ */
  .treat-a {
    display: flex; flex-direction: column;
    justify-content: space-between;
    color: var(--ink);
  }
  .treat-a .top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .treat-a .quote {
    font-weight: 400; font-style: normal;
    color: var(--ink); letter-spacing: -0.012em; line-height: 1.18;
  }
  .treat-a .quote em { font-style: italic; font-weight: 400; color: var(--ink); }
  .treat-a .bottom {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 40px;
  }

  /* ════════════════════════════════════════════
     TREATMENT B — dark ink, bold, § ornament
     ════════════════════════════════════════════ */
  .treat-b {
    display: flex; flex-direction: column;
    justify-content: space-between;
    color: var(--paper);
    position: relative;
  }
  .treat-b::before {
    content: "§";
    position: absolute; top: -40px; right: 52px;
    font-family: var(--display); font-style: italic; font-weight: 400;
    color: var(--moss-2); opacity: .22; line-height: 1;
  }
  .treat-b .top { position: relative; z-index: 2; }
  .treat-b .top .kicker-line { color: var(--moss-2); }
  .treat-b .top .kicker-line::before { color: var(--moss-2); }
  .treat-b .quote {
    font-weight: 600; color: var(--paper);
    letter-spacing: -0.025em; line-height: 1.02;
  }
  .treat-b .quote em { font-style: italic; color: var(--moss-2); font-weight: 500; }
  .treat-b .bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 40px; position: relative; z-index: 2;
    border-top: 1px solid rgba(244,239,230,.2); padding-top: 20px;
  }
  .treat-b .wordmark { color: var(--paper); }
  .treat-b .wordmark em { color: var(--moss-2); }
  .treat-b .attr-line { color: rgba(244,239,230,.55); }
  .treat-b .attr-line em { color: var(--moss-2); }

  /* ════════════════════════════════════════════
     SIZE VARIANTS — set by JS from URL params
     ════════════════════════════════════════════ */

  /* OG 1200×630 */
  .size-og .treat-a { padding: 56px 80px; }
  .size-og .treat-a .kicker-line,
  .size-og .treat-a .attr-line { font-size: 13px; }
  .size-og .treat-a .quote { font-size: 62px; }
  .size-og .treat-a .wordmark { font-size: 54px; }

  .size-og .treat-b { padding: 64px 88px; }
  .size-og .treat-b::before { font-size: 300px; }
  .size-og .treat-b .kicker-line { font-size: 13px; margin-bottom: 44px; }
  .size-og .treat-b .quote { font-size: 80px; }
  .size-og .treat-b .wordmark { font-size: 48px; }
  .size-og .treat-b .attr-line { font-size: 13px; }

  /* Square 1080×1080 */
  .size-square .treat-a { padding: 72px 72px; }
  .size-square .treat-a .kicker-line,
  .size-square .treat-a .attr-line { font-size: 14px; }
  .size-square .treat-a .quote { font-size: 58px; }
  .size-square .treat-a .wordmark { font-size: 48px; }

  .size-square .treat-b { padding: 72px 80px; }
  .size-square .treat-b::before { font-size: 340px; top: -50px; }
  .size-square .treat-b .kicker-line { font-size: 14px; margin-bottom: 48px; }
  .size-square .treat-b .quote { font-size: 72px; }
  .size-square .treat-b .wordmark { font-size: 44px; }
  .size-square .treat-b .attr-line { font-size: 14px; }

  /* Story 1080×1920 */
  .size-story .treat-a { padding: 96px 72px; }
  .size-story .treat-a .kicker-line,
  .size-story .treat-a .attr-line { font-size: 14px; }
  .size-story .treat-a .quote { font-size: 64px; }
  .size-story .treat-a .wordmark { font-size: 48px; }

  .size-story .treat-b { padding: 120px 80px; }
  .size-story .treat-b::before { font-size: 420px; top: -60px; }
  .size-story .treat-b .kicker-line { font-size: 14px; margin-bottom: 56px; }
  .size-story .treat-b .quote { font-size: 80px; }
  .size-story .treat-b .wordmark { font-size: 44px; }
  .size-story .treat-b .attr-line { font-size: 14px; }
</style>
</head>
<body>

<div id="root"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const treatment = params.get('treatment') || 'a';
  const w = parseInt(params.get('w') || '1200', 10);
  const h = parseInt(params.get('h') || '630', 10);
  const kicker = params.get('kicker') || 'On process';
  const quote = params.get('quote') || 'Quote text here.';
  const issue = params.get('issue') || '001';

  const sizeClass =
    (w === 1080 && h === 1920) ? 'size-story' :
    (w === 1080 && h === 1080) ? 'size-square' :
    'size-og';

  const grainClass = treatment === 'b' ? 'grain-dark' : 'grain-light';
  const treatClass = treatment === 'b' ? 'treat-b' : 'treat-a';

  const kickerContent = treatment === 'b'
    ? `§ Issue ${issue} · ${kicker}`
    : `§ Issue ${issue}`;
  const attrRight = treatment === 'b'
    ? `longboard.ai / <em>essays</em>`
    : `${kicker}`;

  // Treatment A: top (kicker + attr) | quote | bottom — three flex children.
  // Treatment B: top (kicker + quote) | bottom — two flex children.
  // This matches the mockup's structure exactly. Treatment B's quote
  // lives inside .top so justify-content:space-between gives it the
  // full upper area instead of squeezing it into the middle third.
  const html = treatment === 'b'
    ? `<div class="card ${grainClass} ${treatClass}" style="width:${w}px;height:${h}px;">
        <div class="top">
          <div class="kicker-line">${kickerContent}</div>
          <div class="quote">${quote}</div>
        </div>
        <div class="bottom">
          <div class="wordmark">Long<em>board</em>.</div>
          <div class="attr-line">${attrRight}</div>
        </div>
      </div>`
    : `<div class="card ${grainClass} ${treatClass}" style="width:${w}px;height:${h}px;">
        <div class="top">
          <div class="kicker-line">${kickerContent}</div>
          <div class="attr-line">${attrRight}</div>
        </div>
        <div class="quote">${quote}</div>
        <div class="bottom">
          <div class="wordmark">Long<em>board</em>.</div>
          <div class="attr-line">longboard.ai</div>
        </div>
      </div>`;

  document.getElementById('root').innerHTML = html;
</script>

</body>
</html>
