name: Longboard approved releases
on:
  schedule:
    - cron: '*/5 12-22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only; do not claim, migrate, merge or deploy'
        type: boolean
        default: true
      credentials_only:
        description: 'Check all three credentials without reading or changing the release queue'
        type: boolean
        default: false
      preview_request:
        description: 'Optional ready ticket UUID to validate without requiring approval (dry run only)'
        type: string
        default: ''
      recovery_request:
        description: 'Manual verify-only reconciliation: merged migration-free ticket UUID'
        type: string
        default: ''
      recovery_merge:
        description: 'Exact 40-character merged commit SHA to reconcile; never merges or deploys'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: longboard-production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (vars.CHAT_RELEASE_SERVICE_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    environment: longboard-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      # No npm install and no execution of PR source in this credentialed job.
      - name: Publish only the owner-approved exact version
        env:
          GITHUB_ACTIONS_TOKEN: ${{ github.token }}
          RELEASE_RECOVERY_REQUEST: ${{ inputs.recovery_request }}
          RELEASE_RECOVERY_MERGE: ${{ inputs.recovery_merge }}
          RELEASE_PREVIEW_REQUEST: ${{ inputs.preview_request }}
          GITHUB_TOKEN: ${{ secrets.LONGBOARD_RELEASE_GITHUB_TOKEN }}
          SUPABASE_RELEASE_TOKEN: ${{ secrets.SUPABASE_RELEASE_TOKEN }}
          VERCEL_RELEASE_TOKEN: ${{ secrets.VERCEL_RELEASE_TOKEN }}
          RELEASE_CREDENTIALS_ONLY: ${{ inputs.credentials_only && 'true' || 'false' }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/chat-release-service.mjs
