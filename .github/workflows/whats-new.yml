name: What's New notes
# #302: when a production deploy succeeds, post one plain-English note to the chat's What's New
# room for the PRs that just went live and have a "What's New:" line (see CLAUDE.md). PRs without
# one are behind-the-scenes and skipped. Safe to rerun: the server never announces a PR twice.
# #443: pictures committed in docs/whats-new/<pr>/ go with the note. Run by hand with
# "pictures_for_pr" to post the pictures of a PR whose note is already out (once per PR).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Deployed commit (full SHA); defaults to the tip of main'
        type: string
        default: ''
      dry_run:
        description: 'Only print what would be posted'
        type: boolean
        default: true
      pictures_for_pr:
        description: 'Only post the pictures in docs/whats-new/<this PR number>/ for a PR already announced'
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: whats-new-notes
  cancel-in-progress: false
jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts/whats-new
            docs/whats-new
      - name: Post the What's New note
        if: github.event_name != 'workflow_dispatch' || inputs.pictures_for_pr == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
          WHATS_NEW_TOKEN: ${{ secrets.WHATS_NEW_TOKEN }}
          WHATS_NEW_URL: ${{ vars.WHATS_NEW_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/whats-new/post-whats-new.mjs
      - name: Post pictures for an announced PR
        if: github.event_name == 'workflow_dispatch' && inputs.pictures_for_pr != ''
        env:
          PICTURES_FOR_PR: ${{ inputs.pictures_for_pr }}
          WHATS_NEW_TOKEN: ${{ secrets.WHATS_NEW_TOKEN }}
          WHATS_NEW_URL: ${{ vars.WHATS_NEW_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/whats-new/post-pictures.mjs
